services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrifit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUTRIFIT_DB_NAME:-nutrifit}
      POSTGRES_USER: ${NUTRIFIT_DB_USER:-nutrifit}
      POSTGRES_PASSWORD: ${NUTRIFIT_DB_PASSWORD:-nutrifit}
    ports:
      - "${NUTRIFIT_DB_PORT:-5433}:5432"
    volumes:
      - nutrifit-postgres-data:/var/lib/postgresql/data

volumes:
  nutrifit-postgres-data:
