spring.application.name=nutrifit-backend

spring.datasource.url=jdbc:postgresql://localhost:${NUTRIFIT_DB_PORT:5433}/${NUTRIFIT_DB_NAME:nutrifit}
spring.datasource.username=${NUTRIFIT_DB_USER:nutrifit}
spring.datasource.password=${NUTRIFIT_DB_PASSWORD:nutrifit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

nutrifit.security.jwt.secret=${NUTRIFIT_JWT_SECRET:desarrollo-nutrifit-clave-secreta-cambiar-en-produccion-0123456789}
nutrifit.security.jwt.expiration-minutes=${NUTRIFIT_JWT_EXPIRATION_MINUTES:10080}
